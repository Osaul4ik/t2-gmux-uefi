name: Build bootx64.efi + FakeSecureBoot.efi (GMUX_Control)

on:
  push:
    branches: [ FSB, master, main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: build-fsb-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE_NAME: apple_set_os_loader
  # EDK2 revision the FSB/ driver is built and tested with (tianocore/edk2)
  EDK2_REF: 870158586f14dbf9d57e312ea6ea87141a1b0699

jobs:
  loader:
    name: Loader (gnu-efi, Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}" .

      - name: Compile bootx64.efi
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            "${IMAGE_NAME}" \
            make clean all

      - name: Verify artifact
        run: |
          set -e
          test -f bootx64.efi
          ls -la bootx64.efi
          file bootx64.efi | grep -qiE 'PE32\+|EFI|executable'

      - name: Upload bootx64.efi
        uses: actions/upload-artifact@v4
        with:
          name: bootx64.efi
          path: bootx64.efi
          if-no-files-found: error
          retention-days: 30

  fsb:
    name: FakeSecureBoot driver (EDK2, runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential nasm uuid-dev python3

      - name: Fetch EDK2
        run: |
          git init "$HOME/edk2"
          cd "$HOME/edk2"
          git remote add origin https://github.com/tianocore/edk2.git
          git fetch --depth 1 origin "${EDK2_REF}"
          git checkout FETCH_HEAD
          # only what BaseTools and MdePkg need
          git submodule update --init --depth 1 \
            BaseTools/Source/C/BrotliCompress/brotli \
            MdePkg/Library/MipiSysTLib/mipisyst \
            MdePkg/Library/ArmTransferListLib/libtl \
            MdePkg/Library/BaseFdtLib/libfdt

      - name: Build BaseTools
        run: make -C "$HOME/edk2/BaseTools" -j"$(nproc)"

      - name: Build FakeSecureBoot.efi
        run: |
          cd "$HOME/edk2"
          export WORKSPACE="$PWD"
          export PACKAGES_PATH="$PWD:${{ github.workspace }}/FSB"
          source edksetup.sh
          build -a X64 -t GCC -b RELEASE -p FakeSecureBootPkg/FakeSecureBootPkg.dsc
          mkdir -p "${{ github.workspace }}/out"
          cp Build/FakeSecureBoot/RELEASE_GCC/X64/FakeSecureBoot.efi "${{ github.workspace }}/out/FakeSecureBoot.efi"

      - name: Verify runtime driver
        run: |
          python3 - <<'PY'
          import struct
          d = open("out/FakeSecureBoot.efi", "rb").read()
          pe = struct.unpack_from("<I", d, 0x3C)[0]
          assert d[pe:pe+4] == b"PE\0\0", "not a PE file"
          machine = struct.unpack_from("<H", d, pe + 4)[0]
          subsystem = struct.unpack_from("<H", d, pe + 24 + 68)[0]
          print("machine", hex(machine), "subsystem", subsystem, "size", len(d))
          assert machine == 0x8664, "not x86-64"
          assert subsystem == 12, "not EFI_RUNTIME_DRIVER (subsystem 12)"
          PY

      - name: Upload FakeSecureBoot.efi
        uses: actions/upload-artifact@v4
        with:
          name: FakeSecureBoot.efi
          path: out/FakeSecureBoot.efi
          if-no-files-found: error
          retention-days: 30

  # Optional: attach both efi files to a GitHub Release when pushing a version tag
  release:
    name: GitHub Release
    needs: [ loader, fsb ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bootx64.efi
            dist/FakeSecureBoot.efi
          generate_release_notes: true
          fail_on_unmatched_files: true